name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org lr.numerilab --project-name numerilab .
          fi
          bash tool/patch_android.sh

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Report build error
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            msg=$(grep -n -A40 -E "What went wrong|error:|Error:|FAILURE" build.log | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
          fi

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk NumeriLab-${{ github.run_number }}.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NumeriLab-apk
          path: NumeriLab-${{ github.run_number }}.apk

      - name: Publish release for phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NumeriLab build ${{ github.run_number }}
          body: |
            Install on Android: download the APK below on your phone and open it.
            You may need to allow "Install unknown apps" for your browser.
            Commit: ${{ github.sha }}
          files: NumeriLab-${{ github.run_number }}.apk
          make_latest: true
